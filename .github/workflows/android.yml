name: Android-APK bauen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    # ubuntu-24.04 bringt das Android-SDK vorinstalliert mit (ANDROID_HOME)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Version auslesen
        id: ver
        run: echo "version=$(grep -oP 'APP_VERSION = "\K[^"]+' web/index.html)" >> "$GITHUB_OUTPUT"

      - name: APK bauen
        run: gradle -p android assembleRelease

      - name: Release mit APK veröffentlichen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: Schlafrechner ${{ steps.ver.outputs.version }}
          files: android/app/build/outputs/apk/release/Schlafrechner-${{ steps.ver.outputs.version }}.apk
          make_latest: true
